<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
<rect width="1200" height="630" fill="#060606"/>
<rect x="0" y="0" width="1200" height="8" fill="#fff500"/>
<text x="76" y="96" fill="#fff500" font-size="18" font-weight="700" letter-spacing="3" font-family="'Space Grotesk',Inter,system-ui,sans-serif">FIELD NOTES</text>
<text x="76" y="176" fill="#f4f4f5" font-size="50" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Statistical gating for</text>
<text x="76" y="234" fill="#f4f4f5" font-size="50" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">agent instruction changes</text>
<line x1="76" y1="278" x2="196" y2="278" stroke="#fff500" stroke-width="4"/>
<text x="76" y="334" fill="rgba(244,244,245,0.65)" font-size="24" font-family="'Space Grotesk',Inter,system-ui,sans-serif">I required a t-test before any edit could stay.</text>
<text x="76" y="370" fill="rgba(244,244,245,0.65)" font-size="24" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Then I ran the power calculation on my own gate.</text>
<text x="76" y="486" fill="#fff500" font-size="92" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">44%</text>
<text x="316" y="464" fill="#f4f4f5" font-size="24" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">power at a 14-day window</text>
<text x="316" y="498" fill="rgba(244,244,245,0.55)" font-size="21" font-family="'Space Grotesk',Inter,system-ui,sans-serif">to see a lift the config calls significant</text>
<text x="76" y="590" fill="#f4f4f5" font-size="21" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Michael Kaminski</text>
<text x="281" y="590" fill="rgba(244,244,245,0.45)" font-size="21" font-family="'Space Grotesk',Inter,system-ui,sans-serif">michael-kaminski.io</text>
</svg>