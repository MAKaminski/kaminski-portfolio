<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Bar chart of measured latency as a share of budget. donation_create first call 17 ms of 50, warm call 2 ms of 50, CLI help 149 ms of 300."><rect width="920" height="520" fill="#060606"/><text x="40.0" y="40.0" fill="#f4f4f5" font-size="20" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">The deterministic half, measured against its budget</text><text x="40.0" y="62.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Measured 2026-11-15 from a fresh clone. Budgets were set in the proposal before the code existed.</text><text x="234.0" y="132.0" fill="#f4f4f5" font-size="14" text-anchor="end" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">donation_create, first call</text><rect x="250" y="110" width="610" height="34" fill="rgba(244,244,245,0.28)" rx="3"/><rect x="250" y="110" width="207.4" height="34" fill="#fff500" rx="3"/><text x="467.4" y="132.0" fill="#f4f4f5" font-size="14" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">17 ms</text><text x="860.0" y="164.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">budget 50 ms p95</text><text x="250.0" y="164.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">34% of budget</text><text x="234.0" y="224.0" fill="#f4f4f5" font-size="14" text-anchor="end" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">donation_create, warm</text><rect x="250" y="202" width="610" height="34" fill="rgba(244,244,245,0.28)" rx="3"/><rect x="250" y="202" width="24.4" height="34" fill="#fff500" rx="3"/><text x="284.4" y="224.0" fill="#f4f4f5" font-size="14" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">2 ms</text><text x="860.0" y="256.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">budget 50 ms p95</text><text x="250.0" y="256.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">4% of budget</text><text x="234.0" y="316.0" fill="#f4f4f5" font-size="14" text-anchor="end" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">CLI --help (median of 7)</text><rect x="250" y="294" width="610" height="34" fill="rgba(244,244,245,0.28)" rx="3"/><rect x="250" y="294" width="303.0" height="34" fill="#fff500" rx="3"/><text x="563.0" y="316.0" fill="#f4f4f5" font-size="14" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">149 ms</text><text x="860.0" y="348.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">budget 300 ms</text><text x="250.0" y="348.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">50% of budget</text><text x="40.0" y="492.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">For scale: the proposal estimates 18 s end to end for the model half. That bar would be 360x the widest budget shown.</text></svg>