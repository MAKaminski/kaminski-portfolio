<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Bar chart. 450 blouses log at 900 dollars on low, 3,150 on mid and 5,400 on high. The 5,000 dollar appraisal line sits between mid and high."><rect width="920" height="520" fill="#060606"/><text x="40.0" y="40.0" fill="#f4f4f5" font-size="20" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Same 450 blouses, one flag</text><text x="40.0" y="62.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Logged value by basis (low / mid / high of the published guide range). goodwill-mcp v0.1.0, run 2026-11-15.</text><line x1="78" y1="436.0" x2="880" y2="436.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="440.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">$0</text><line x1="78" y1="379.3" x2="880" y2="379.3" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="383.3" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">$1,000</text><line x1="78" y1="322.7" x2="880" y2="322.7" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="326.7" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">$2,000</text><line x1="78" y1="266.0" x2="880" y2="266.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="270.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">$3,000</text><line x1="78" y1="209.3" x2="880" y2="209.3" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="213.3" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">$4,000</text>