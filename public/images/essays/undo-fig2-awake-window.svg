<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Timeline. The approve at zero seconds wakes the compute. The commit fires at ten seconds. The compute stays awake until five minutes after the last query either way, then sleeps."><rect width="920" height="520" fill="#060606"/><text x="40.0" y="40.0" fill="#f4f4f5" font-size="20" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Why the undo window is free</text><text x="40.0" y="62.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">One approval on a scale-to-zero database. Time since the reviewer clicked approve.</text><rect x="60.0" y="210" width="751.5" height="46" fill="rgba(244,244,245,0.28)" rx="3"/><rect x="60.0" y="210" width="24.2" height="46" fill="#fff500" rx="3"/><rect x="811.5" y="210" width="48.5" height="46" fill="none" stroke="rgba(255,255,255,0.10)" stroke-dasharray="5 4" rx="3"/><line x1="60.0" y1="256" x2="60.0" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="60.0" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">0 s</text><line x1="84.2" y1="256" x2="84.2" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="84.2" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">10 s</text><line x1="205.5" y1="256" x2="205.5" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="205.5" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">1 min</text><line x1="350.9" y1="256" x2="350.9" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="350.9" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">2 min</text><line x1="496.4" y1="256" x2="496.4" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="496.4" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">3 min</text><line x1="641.8" y1="256" x2="641.8" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="641.8" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">4 min</text><line x1="811.5" y1="256" x2="811.5" y2="266" stroke="rgba(244,244,245,0.55)"/><text x="811.5" y="284.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">5 min 10 s</text><text x="60.0" y="166.0" fill="#f4f4f5" font-size="13" text-anchor="start" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Approve (a query: compute is awake)</text><line x1="60.0" y1="174" x2="60.0" y2="210" stroke="#f4f4f5"/><text x="90.2" y="196.0" fill="#fff500" font-size="13" text-anchor="start" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Timer fires, commit runs</text><line x1="84.2" y1="202" x2="84.2" y2="210" stroke="#fff500"/><text x="447.9" y="239.0" fill="#f4f4f5" font-size="13" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Awake anyway: 5 minutes after the last query</text><text x="835.8" y="239.0" fill="rgba(244,244,245,0.55)" font-size="12" text-anchor="middle" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">asleep</text><text x="40.0" y="360.0" fill="#f4f4f5" font-size="14" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Undo window: 10 s of a 300 s idle timeout the compute pays regardless.</text><text x="40.0" y="384.0" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">A 1 s poll never lets the right-hand box happen: 730 h awake x 0.25 CU = 182.5 CU-hours a month.</text><rect x="40" y="420" width="14" height="14" fill="#fff500" rx="2"/><text x="62.0" y="432.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">undo window</text><rect x="170" y="420" width="14" height="14" fill="rgba(244,244,245,0.28)" rx="2"/><text x="192.0" y="432.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Neon's idle timeout (Free plan, fixed)</text></svg>