<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="100%" role="img" aria-labelledby="f1t f1d">
<title id="f1t">Minimum detectable effect by window length</title>
<desc id="f1d">A 14-day window can only detect a shift of 0.97 standard deviations, which is 8.3 percent of a 7.0 baseline. The 5 percent lift threshold declared in the config equals 0.58 standard deviations and is not reachable until roughly 38 days per window.</desc>
<rect width="920" height="520" fill="#060606"/>
<text x="78" y="30" fill="#f4f4f5" font-size="19" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">What a 14-day window can actually see</text>
<text x="78" y="50" fill="rgba(244,244,245,0.55)" font-size="13" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Minimum detectable effect · Welch&#8217;s t-test · &#945; = 0.10 · 80% power</text>
