<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 452" width="100%" role="img" aria-labelledby="f3t f3d">
<title id="f3t">What a 5% threshold actually means at a 14-day window</title>
<desc id="f3d">With a 14-day window, the smallest lift the gate can reliably detect rises with day-to-day variance: 5.5 percent at SD 0.4, 8.3 percent at SD 0.6, and 13.8 percent at SD 1.0. The declared 5 percent threshold binds in none of these cases.</desc>
<rect width="920" height="452" fill="#060606"/>
<text x="16" y="30" fill="#f4f4f5" font-size="19" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Your &#8220;5% threshold&#8221; at a 14-day window, by day-to-day variance</text>
<text x="16" y="50" fill="rgba(244,244,245,0.55)" font-size="13" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Smallest lift the gate can actually detect at 80% power</text>
<line x1="338.7" y1="96" x2="338.7" y2="398" stroke="#f4f4f5" stroke-width="2" stroke-dasharray="6 5" opacity="0.8"/><text x="338.7" y="88" fill="#f4f4f5" font-size="13" text-anchor="middle" font-weight="600" font-family="'Space Grotesk',Inter,system-ui,sans-serif">what the config says: 5%</text>
<rect x="108" y="119.7" width="253.7" height="29.7" rx="3" fill="#fff500" opacity="0.95"/><text x="373.7" y="141.1" fill="#f4f4f5" font-size="16" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">5.5%</text><text x="92" y="141.1" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="end" font-family="'Space Grotesk',Inter,system-ui,sans-serif">SD 0.4</text><rect x="108" y="176.9" width="318.3" height="29.7" rx="3" fill="#fff500" opacity="0.95"/><text x="438.3" y="198.3" fill="#f4f4f5" font-size="16" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">6.9%</text><text x="92" y="198.3" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="end" font-family="'Space Grotesk',Inter,system-ui,sans-serif">SD 0.5</text><rect x="108" y="234.1" width="382.9" height="29.7" rx="3" fill="#ff6b6b" opacity="0.85"/><text x="502.9" y="255.5" fill="#f4f4f5" font-size="16" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">8.3%</text><text x="92" y="255.5" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="end" font-family="'Space Grotesk',Inter,system-ui,sans-serif">SD 0.6</text><rect x="108" y="291.3" width="512.1" height="29.7" rx="3" fill="#ff6b6b" opacity="0.85"/><text x="632.1" y="312.7" fill="#f4f4f5" font-size="16" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">11.1%</text><text x="92" y="312.7" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="end" font-family="'Space Grotesk',Inter,system-ui,sans-serif">SD 0.8</text><rect x="108" y="348.5" width="636.6" height="29.7" rx="3" fill="#ff6b6b" opacity="0.85"/><text x="756.6" y="369.9" fill="#f4f4f5" font-size="16" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">13.8%</text><text x="92" y="369.9" fill="rgba(244,244,245,0.55)" font-size="14" text-anchor="end" font-family="'Space Grotesk',Inter,system-ui,sans-serif">SD 1.0</text>
<text x="16" y="434" fill="rgba(244,244,245,0.55)" font-size="13" font-family="'Space Grotesk',Inter,system-ui,sans-serif">The gap between the dashed line and the bar is the part hidden from whoever reads the config file.</text>
</svg>