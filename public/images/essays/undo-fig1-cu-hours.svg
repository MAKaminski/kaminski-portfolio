<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" role="img" aria-label="Bar chart. A one-second poll uses 182.5 CU-hours a month. Timers use about 25: 15 for the hourly pull and 10 for real usage. The Free plan allowance is 100."><rect width="920" height="520" fill="#060606"/><text x="40.0" y="40.0" fill="#f4f4f5" font-size="20" text-anchor="start" font-weight="700" font-family="'Space Grotesk',Inter,system-ui,sans-serif">What it costs to wait: Neon Free, CU-hours per month</text><text x="40.0" y="62.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="start" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">Same 10-second undo window, two ways to wait. 0.25 CU compute, 730 hours in a month.</text><line x1="78" y1="436.0" x2="880" y2="436.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="440.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">0</text><line x1="78" y1="351.0" x2="880" y2="351.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="355.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">50</text><line x1="78" y1="266.0" x2="880" y2="266.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="270.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">100</text><line x1="78" y1="181.0" x2="880" y2="181.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="185.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">150</text><line x1="78" y1="96.0" x2="880" y2="96.0" stroke="rgba(255,255,255,0.10)"/><text x="66.0" y="100.0" fill="rgba(244,244,245,0.55)" font-size="13" text-anchor="end" font-weight="400" font-family="'Space Grotesk',Inter,system-ui,sans-serif">200</te